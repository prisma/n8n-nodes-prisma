# Publishes @prisma/n8n-nodes-prisma to npm on every version tag push.
#
# Authentication uses npm Trusted Publishing (OIDC). There is no npm token in
# this repository and none should be added. npm accepts the publish because the
# package lists this exact repository and workflow file as a trusted publisher:
#
#   Repository: prisma/n8n-nodes-prisma
#   Workflow:   publish.yml
#   Environment: (none)
#
# Renaming this file or moving the repository breaks publishing until the
# trusted publisher entry on npmjs.com is updated to match.
#
# n8n requires community nodes to be published from GitHub Actions with an npm
# provenance statement. `npm run release` detects CI and publishes with
# provenance enabled.
#
# To release, run `npm run release` locally. It lints, builds, bumps the
# version, updates the changelog, commits, tags, and pushes. The tag triggers
# this workflow.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint the OIDC token that npm exchanges for publish access
      # and uses to sign the provenance statement.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Use an npm version that supports Trusted Publishing
        # OIDC publishing needs npm 11.5.1 or newer.
        run: 'npm install -g npm@^11.5.1'

      - name: Install dependencies
        run: 'npm ci'

      - name: Release
        # Lint and build run as part of the release, then npm publishes with
        # provenance using the OIDC token. No token is read from secrets.
        run: 'npm run release'
